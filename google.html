<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="google.css">
    <link rel="icon" type="image/x-icon" href="images/google icon.jpe">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Gmail</a></li>
                <li><a href="#">Images</a></li>
                <li><a href="#"><img src="images/tallscale.jpe  " alt="tallscale-icon" id="casey"></a></li>
                <li><a href="#"><img src="images/casey-gmail-icon.png" alt="gmail-icon" class="casey"></a></li>
            </ul>
        </nav>
    </header>

    <div class="main">
        <div class="logo">
            <img src="images/google logo.png" alt="Google Logo">
        </div>
        
        <div class="search-container">
            <input type="text" name="q" placeholder="Ask Google" id="search-bar">
            <div class="tools">
                <img src="images/plus-svgrepo-com.svg" alt="plus" class="plus">
                <img src="images/microphone-svgrepo-com.svg" alt="" class="mic">
                <img src="images/visual-search-svgrepo-com.svg" alt="" class="image-search">
                <span class="ai-mode"><img src="images/magnifying-glass-for-search-svgrepo-com.svg" alt="AI mode" class="mglass"><p>AI Mode</p></span>
            </div>
        </div>

        <div class="ad-container">
            <div class="ad-item">
                <div class="img-logo">
                    <img src="images/magnifying-glass-for-search-svgrepo-com.svg" alt="search">
                </div>

                <div class="body">
                    <p class="h2"><b>Do more with AI Mode</b></p>
                    <p>Create, plan, summarize</p>
                </div>
            </div>

            <div class="ad-item">
                <div class="img-logo">
                    <img src="images/banana.png" alt="banana" class="ad">
                </div>

                <div class="body">
                    <p class="h2"><b>Create images</b></p>
                    <p>Reimagine, illustrate, edit</p>
                </div>
            </div>
        </div>

        <div class="flex-container">
            <div class="flex-item"><a href="#"><img src="images/vs-wiki-logo.webp" alt=""></a></div>
            <div class="flex-item"><a href="#"><img src="images/animepahe-icon.png" alt=""></a></div>
            <div class="flex-item"><a href="#"><img src="images/imgur-icon.png" alt=""></a></div>
            <div class="flex-item"><a href="#"><img src="images/comix-icon.webp" alt=""></a></div>
            <div class="flex-item"><a href="#"><img src="images/discord-icon.webp" alt=""></a></div>
            <div class="flex-item"><a href="#"><img src="images/expand_content_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></a></div>
        </div>

    </div>

</body>
</html>
