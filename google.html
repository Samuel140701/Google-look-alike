<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="google.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Gmail</a></li>
                <li><a href="#">Images</a></li>
                <li><a href="#"><i class="fa-solid fa-th"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-circle-user"></i></a></li>
            </ul>
        </nav>
    </header>

    <div class="main">
        <div class="logo">
            <img src="images/google logo.png" alt="Google Logo">
        </div>
        
        <div class="search-container">
            <input type="text" name="q" placeholder="Ask Google" id="search-bar">
            <div class="tools">
                <img src="images/plus-svgrepo-com.svg" alt="plus" class="plus">
                <img src="images/microphone-svgrepo-com.svg" alt="" class="mic">
                <img src="images/visual-search-svgrepo-com.svg" alt="" class="image-search">
                <span class="ai-mode"><img src="images/magnifying-glass-for-search-svgrepo-com.svg" alt="AI mode" class="mglass"><p>AI Mode</p></span>
            </div>
        </div>
    </div>

</body>
</html>
